<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfdadf">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#cfdadf;--card:#f4f8f9;--ink:#26323a;--mute:#5d6e78;--acc:#d4a024;--acc2:#2f7d6d;--line:#b3c3ca;--wall:#e3edf0;--floor:#c3d1d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b2328;--card:#26323a;--ink:#e8eef1;--mute:#9db0ba;--line:#3b4b55;--acc:#e3b23c;--acc2:#4fb39f;--wall:#32424c;--floor:#202b32}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-size:16px}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
button,input,select{font:inherit;color:inherit}
h1{font-size:22px;margin:0;font-weight:600;flex:1}
h2{font-size:17px;margin:18px 0 8px;font-weight:600}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pill{background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px}
.ib{background:var(--card);border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}
.stage{background:var(--card);border-radius:24px;padding:8px 12px 14px;text-align:center;position:relative;overflow:hidden}
#robot svg{width:100%;max-width:340px;border-radius:16px;cursor:pointer;display:block;margin:0 auto}
#robot svg *{transform-box:fill-box}
#bolt{transform-origin:50% 100%}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.jump{animation:jump .6s}.spin{animation:spin .8s}.wig{animation:wig .5s}
@keyframes jump{30%{transform:translateY(-22px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.flame{animation:fl .25s infinite alternate}
@keyframes fl{to{transform:scaleY(.7)}}
@media (prefers-reduced-motion:reduce){.bob,.jump,.spin,.wig,.flame{animation:none}}
.heart{position:absolute;bottom:90px;font-size:22px;pointer-events:none;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.say{font-size:15px;margin:8px 0 6px;min-height:22px}
.acts{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.btn{background:var(--acc);color:#26323a;border:0;border-radius:14px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn.g{background:var(--line);color:var(--ink)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .4s}
.bar.g i{background:var(--acc2)}
.lbl{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px}
.tabs button{background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px 0;cursor:pointer;font-size:14px}
.tabs button.on{border-color:var(--acc2);font-weight:600}
.q{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin-bottom:8px;text-align:left;cursor:pointer}
.q:focus-visible,.tabs button:focus-visible,.btn:focus-visible{outline:3px solid var(--acc2)}
.q.on{border-color:var(--acc2)}.q.off{opacity:.45}
.q .ic{font-size:24px}.q .t{flex:1}
.q .t small{display:block;color:var(--mute);font-size:13px}
.q .x{font-weight:600;color:var(--acc2);white-space:nowrap}
.q.on .t span{text-decoration:line-through;color:var(--mute)}
.add{background:var(--card);border-radius:16px;padding:12px 14px}
.add summary{cursor:pointer;font-weight:500}
.add input,.add select{background:var(--bg);border:0;border-radius:10px;padding:8px 10px;width:100%;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px;margin-bottom:10px}
.row label{font-size:12px;color:var(--mute)}
.cq{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.cq button{background:none;border:0;cursor:pointer;font-size:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.nav button{background:var(--card);border:0;border-radius:12px;width:40px;height:34px;cursor:pointer;font-size:18px}
.nav button:disabled{opacity:.3}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:16px;padding:12px 8px 8px;position:relative}
.col{text-align:center;font-size:12px;color:var(--mute)}.col b{display:block;color:var(--ink);font-size:13px}
.bw{height:90px;background:var(--bg);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bw i{width:100%;background:var(--line);border-radius:8px 8px 0 0}.bw i.hit{background:var(--acc2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{background:var(--card);border-radius:10px;text-align:center;font-size:11px;color:var(--mute);padding:4px 0;min-height:42px}
.cal div b{display:block;font-size:14px;color:var(--ink)}
.cal .hit{background:var(--acc2);color:#fff}.cal .hit b{color:#fff}
.cal .miss b{color:#c0533a}.cal .fut{opacity:.4}.cal .today{outline:2px solid var(--acc)}.cal .e{background:none}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.pr{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{background:var(--card);border:2px solid transparent;border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer}
.it.on{border-color:var(--acc2)}.it b{display:block;font-size:26px;font-weight:400}.it small{display:block;font-size:12px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.s{opacity:1}
.reset{background:none;border:0;color:var(--mute);font-size:13px;margin-top:20px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
 <div class="top"><h1>Bolt</h1><span class="pill" id="coins"></span><button class="ib" data-act="snd" id="snd" aria-label="Geluid aan of uit">🔊</button></div>
 <div class="stage">
  <div id="robot"></div>
  <div class="say" id="say"></div>
  <div class="acts"><button class="btn" data-act="pet">🤗 Aaien</button><button class="btn g" data-act="play">🎮 Speel</button></div>
  <div class="lbl"><span>Level <b id="lv"></b> <span id="evo"></span></span><span id="xpn"></span></div>
  <div class="bar"><i id="lvbar"></i></div>
 </div>
 <div class="stats">
  <div class="stat"><b id="sStreak">0</b><span>dagen streak</span></div>
  <div class="stat"><b id="sDay">0</b><span>XP vandaag</span></div>
  <div class="stat"><b id="sWeek">0</b><span>XP deze week</span></div>
 </div>
 <div class="lbl"><span>Dagdoel</span><span id="dgl"></span></div><div class="bar g"><i id="dbar"></i></div>
 <div class="lbl"><span>Weekdoel (bonus +50 XP)</span><span id="wgl"></span></div><div class="bar g"><i id="wbar"></i></div>
 <nav class="tabs" id="tabs"></nav>
 <div id="view"></div>
 <button class="reset" data-act="reset">Alles opnieuw beginnen</button>
</main>
<div class="toast" id="toast"></div>
<script>
const DEF=[
 {id:'study',n:'Studeren (2 uur)',xp:20,ic:'📚',say:'Slim, slimmer, Bolt-slimst! 🤓'},
 {id:'class',n:'Naar de les',xp:15,cap:5,days:[1,2,3,4,5],ic:'🎓',say:'Les gehaald! Ik ben zo trots.'},
 {id:'gym',n:'Gym',xp:20,cap:5,ic:'🏋️',say:'Spierballen aan! 💪'},
 {id:'run',n:'Gaan lopen',xp:25,cap:2,ic:'🏃',say:'Zoef! Wat ben jij snel!'},
 {id:'bike',n:'Gaan fietsen',xp:30,cap:1,days:[0,6],ic:'🚴',say:'Trap trap trap! Wiel-der-wijs!'}];
const SHOP=[
 {id:'cap',k:'hat',n:'Petje',p:40,ic:'🧢'},{id:'tophat',k:'hat',n:'Hoge hoed',p:60,ic:'🎩'},{id:'crown',k:'hat',n:'Kroon',p:120,ic:'👑'},
 {id:'shades',k:'eyes',n:'Zonnebril',p:50,ic:'🕶️'},{id:'glasses',k:'eyes',n:'Bril',p:30,ic:'👓'},
 {id:'scarf',k:'neck',n:'Sjaal',p:40,ic:'🧣'},{id:'bow',k:'neck',n:'Strikje',p:30,ic:'🎀'},
 {id:'blue',k:'color',n:'Blauw',p:80,ic:'🔵'},{id:'green',k:'color',n:'Groen',p:80,ic:'🟢'},{id:'red',k:'color',n:'Rood',p:80,ic:'🔴'},
 {id:'plant',k:'room',n:'Plantje',p:30,ic:'🪴'},{id:'lamp',k:'room',n:'Lamp',p:40,ic:'💡'},{id:'rug',k:'room',n:'Tapijt',p:40,ic:'🟫'},
 {id:'poster',k:'room',n:'Poster',p:50,ic:'🖼️'},{id:'window',k:'room',n:'Raam',p:50,ic:'🪟'},{id:'shelf',k:'room',n:'Boekenkast',p:70,ic:'📚'}];
const COL={blue:'#4a8fd4',green:'#4fa36a',red:'#d4574a'};
const GOAL=30,WGOAL=300,BONUS=50,KEY='bolt-v1';
const DN=['ma','di','wo','do','vr','za','zo'];
const MN=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addD(d,-((d.getDay()+6)%7));
const today=()=>new Date();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,tab='today',wOff=0,mOff=0,FX=null,ft,bub=null,bt,base='';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.done)S={start:ymd(today()),done:{},bonus:{},maxLvl:1};
 S.bonus=S.bonus||{};S.maxLvl=S.maxLvl||1;
 if(S.coins===undefined)S.coins=(S.maxLvl-1)*15+Math.floor(S.maxLvl/5)*60;
 S.tasks=S.tasks||DEF.map(t=>({...t}));S.tasks.forEach(t=>{if(t.id==='class'&&!t.days)t.days=[1,2,3,4,5];if(t.id==='bike'&&!t.days)t.days=[0,6]});S.owned=S.owned||[];S.wear=S.wear||{};S.mute=!!S.mute}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dayXP=k=>Object.values(S.done[k]||{}).reduce((a,b)=>a+b,0);
function streak(){let d=today();if(dayXP(ymd(d))<GOAL)d=addD(d,-1);let n=0;
 while(ymd(d)>=S.start&&dayXP(ymd(d))>=GOAL){n++;d=addD(d,-1)}return n}
function misses(){let n=0;for(let i=1;i<=7;i++){const k=ymd(addD(today(),-i));if(k>=S.start&&dayXP(k)<GOAL)n++}return n}
const wDays=o=>{const m=addD(monday(today()),7*(o||0));return [...Array(7)].map((_,i)=>ymd(addD(m,i)))};
const wCount=(id,o)=>wDays(o).filter(k=>S.done[k]&&S.done[k][id]!==undefined).length;
const wXP=()=>wDays().reduce((a,k)=>a+dayXP(k),0)+(S.bonus[wDays()[0]]||0);
const total=()=>Object.keys(S.done).reduce((a,k)=>a+dayXP(k),0)+Object.values(S.bonus).reduce((a,b)=>a+b,0);
const lvlOf=t=>Math.floor(Math.sqrt(t/40))+1;
const okDay=(T,d)=>!T.days||T.days.includes((d||today()).getDay());
const wkEnd=()=>[0,6].includes(today().getDay());
const xmult=()=>(1+Math.min(streak(),10)*.05)*(wkEnd()?1.5:1);
const mood=()=>{const m=misses();return m===0?0:m<=2?1:m<=4?2:3};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),2400)}

/* geluid */
let AC;
function tone(f,t,d,ty,v,f2){if(S.mute)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(t||0);d=d||.12;o.type=ty||'square';o.frequency.setValueAtTime(f,s);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v||.06,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);
 o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
const SND={ok:()=>{tone(660,0,.1);tone(880,.1,.16)},undo:()=>tone(300,0,.15,'triangle'),tap:()=>tone(500,0,.18,'sine',.09,1000),
 lvl:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.2)),buy:()=>{tone(988,0,.08);tone(1319,.08,.22)},err:()=>tone(180,0,.2,'sawtooth'),
 play:()=>[392,494,587,494,659].forEach((f,i)=>tone(f,i*.1,.12,'triangle',.08))};

/* motivatie */
function line(){const m=mood(),h=today().getHours(),dw=today().getDay(),x=dayXP(ymd(today())),st=streak(),L=[];
 if(m>=2)L.push('Hé, ik mis je… één quest en ik ben weer vrolijk!','Opnieuw beginnen is ook winnen. 💪','Ik geloof in jou, baas!');
 else{
  if(x>=GOAL)L.push('Dagdoel gehaald! Ik ben zo trots! 🎉','Dat was een topdag, baas!');else L.push('Nog '+(GOAL-x)+' XP en het dagdoel is van jou!');
  if(st>=3)L.push(st+' dagen op rij! Jij bent een machine, net als ik. 🔥');
  if(h<12)L.push('Goeiemorgen! Zullen we er een mooie dag van maken?');else if(h<18)L.push('De dag is nog lang. Tijd voor een quest?');else L.push('Nog even doorbijten voor het slapen!');
  if(dw===1)L.push('Maandag! Frisse week, frisse start. 🚀');if(dw===5)L.push('Vrijdag! Sprint naar de finish van je week.');if(dw===0)L.push('Zondag: nog even je weekdoel afronden?');
  const w=wXP();if(w>=WGOAL)L.push('Weekdoel binnen! Jij bent een legende. 🏆');else if(w>=WGOAL*.7)L.push('Bijna je weekdoel! Nog '+(WGOAL-w)+' XP.');
 }return L[Math.floor(Math.random()*L.length)]}
const base0=()=>{base=line()};
function say(t,ms){bub=t;clearTimeout(bt);bt=setTimeout(()=>{bub=null;base0();renderStage()},ms||3500);renderStage()}
function anim(c){const b=document.getElementById('bolt');if(!b)return;b.classList.remove('jump','spin','wig');void b.getBoundingClientRect();b.classList.add(c);setTimeout(()=>b&&b.classList.remove(c),900)}
function hearts(){const s=document.querySelector('.stage');for(let i=0;i<3;i++){const h=document.createElement('span');h.className='heart';h.textContent=['❤️','💛','✨'][i%3];h.style.left=(35+Math.random()*30)+'%';h.style.animationDelay=(i*.15)+'s';s.appendChild(h);setTimeout(()=>h.remove(),1500)}}
function pet(){const m=mood();SND.tap();hearts();
 const T=m>=2?[['Dankjewel… ik voel me al wat beter.','wig'],['Doe een quest, dan lach ik weer!','jump']]:
 [['Hihi, dat kietelt!','wig'],['Bliep bloep! 💛','jump'],['Wheee!','spin'],['Nog eens! Nog eens!','jump'],['*knippert blij*','wig'],['Ik ben jouw grootste fan!','jump']];
 const r=T[Math.floor(Math.random()*T.length)];say(r[0],2500);anim(r[1])}
function play(){SND.play();hearts();const A=[['Dansje! 💃','spin'],['Hoppa!','jump'],['Zwaai zwaai! 👋','wig']];const r=A[Math.floor(Math.random()*3)];say(r[0],2500);anim(r[1]);setTimeout(()=>anim('jump'),900)}

/* Bolt tekenen */
const ROOM={
 rug:'<ellipse cx="150" cy="188" rx="96" ry="8" fill="#c06a5a"/>',
 poster:'<rect x="8" y="14" width="38" height="48" rx="3" fill="#f2e3b3" stroke="#8a6a3a" stroke-width="2"/><circle cx="27" cy="30" r="7" fill="#d4574a"/><path d="M14 56l10-14 8 9 5-6 6 11z" fill="#4f9a4a"/>',
 window:'<rect x="254" y="14" width="40" height="42" rx="3" fill="#8fc3e8" stroke="#8a6a3a" stroke-width="3"/><path d="M274 14v42M254 35h40" stroke="#8a6a3a" stroke-width="2"/><circle cx="264" cy="25" r="3" fill="#fff6a0"/>',
 plant:'<rect x="14" y="160" width="22" height="22" rx="3" fill="#b5653a"/><path d="M25 160v-20" stroke="#4f9a4a" stroke-width="3"/><path d="M25 146q-14-4-14-16 14 0 14 16zM25 144q14-4 14-16-14 0-14 16z" fill="#5db35a"/>',
 lamp:'<path d="M64 182v-50" stroke="#6b6a64" stroke-width="3"/><path d="M52 132h24l-5-22h-14z" fill="#f2c94c"/><ellipse cx="64" cy="184" rx="9" ry="3" fill="#6b6a64"/>',
 shelf:'<rect x="256" y="96" width="38" height="86" rx="3" fill="#8a6a3a"/><path d="M256 124h38M256 152h38" stroke="#5e4526" stroke-width="2"/><rect x="262" y="104" width="6" height="18" fill="#d4574a"/><rect x="270" y="108" width="6" height="14" fill="#4a8fd4"/><rect x="278" y="102" width="6" height="20" fill="#4fa36a"/><rect x="262" y="134" width="22" height="16" fill="#f2c94c"/>'};
const SPD='<path d="M8 90h24M4 110h26M10 130h22" stroke="var(--mute)" stroke-width="3" stroke-linecap="round"/>';
const FXD={
 study:'<g fill="none" stroke="#26323a" stroke-width="3"><circle cx="73" cy="57" r="18"/><circle cx="127" cy="57" r="18"/><path d="M91 57h18"/></g>',
 class:'<path d="M58 36l42-16 42 16-42 16z" fill="#26323a"/><path d="M140 36v16" stroke="#f2c94c" stroke-width="3"/>',
 gym:'<path d="M46 112q-26-10-22-42M154 112q26-10 22-42" stroke="#6b6a64" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="72" y="14" width="56" height="5" fill="#6b6a64"/><rect x="64" y="6" width="8" height="21" rx="2" fill="#26323a"/><rect x="128" y="6" width="8" height="21" rx="2" fill="#26323a"/>',
 run:SPD+'<path d="M152 30q-5 9 0 12 5-3 0-12zM44 28q-5 9 0 12 5-3 0-12z" fill="#6bb6e8"/>',
 bike:SPD+'<path d="M54 40a46 30 0 0 1 92 0z" fill="#4a8fd4"/>'};
function robot(m){
 const w=S.wear,st=Math.floor(S.maxLvl/5),bc=COL[w.color]||'#d4a024',own=i=>S.owned.includes(i);
 const lid=[0,8,16,24][m],dy=[0,0,3,6][m],hv=['#e0533d','#e0a03d','#7f8c93','#4b5a62'][m];
 let r='<svg viewBox="0 0 300 200" role="img" aria-label="Bolt in zijn kamer"><rect width="300" height="200" style="fill:var(--wall)"/><rect y="172" width="300" height="28" style="fill:var(--floor)"/>';
 for(const k in ROOM)if(own(k))r+=ROOM[k];
 r+='<g transform="translate(50 0)"><g class="'+(m===0?'bob':'')+'"><g id="bolt">';
 if(st>=4)r+='<ellipse cx="100" cy="100" rx="98" ry="92" fill="none" stroke="#f2c94c" stroke-width="3" opacity=".6" stroke-dasharray="4 6"/>';
 if(st>=3)r+='<rect x="30" y="104" width="12" height="36" rx="5" fill="#6b6a64"/><rect x="158" y="104" width="12" height="36" rx="5" fill="#6b6a64"/><path class="flame" d="M36 142q-6 10 0 16 6-6 0-16zM164 142q-6 10 0 16 6-6 0-16z" fill="#f28c28"/>';
 r+='<rect x="96" y="76" width="8" height="22" fill="#6b6a64"/><rect x="46" y="96" width="108" height="64" rx="10" fill="'+bc+'" stroke="#3b3a36" stroke-width="3"/><rect x="46" y="128" width="108" height="6" fill="#00000022"/>'+
 '<rect x="84" y="106" width="32" height="18" rx="4" fill="#26323a"/><path d="M100 120l-8-7a4.5 4.5 0 0 1 8-4 4.5 4.5 0 0 1 8 4z" fill="'+hv+'"/>'+
 '<path d="M46 112q-22 6-20 26M154 112q22 6 20 26" stroke="#6b6a64" stroke-width="7" fill="none" stroke-linecap="round"/>'+

 if(st>=2)r+='<rect x="44" y="90" width="26" height="8" rx="2" fill="#2a4d8f" stroke="#9db7e0"/><rect x="130" y="90" width="26" height="8" rx="2" fill="#2a4d8f" stroke="#9db7e0"/>';
 for(const x of [52,106]){const c=x+21;r+='<rect x="'+x+'" y="38" width="42" height="38" rx="19" fill="#e6ecef" stroke="#3b3a36" stroke-width="3"/><circle cx="'+c+'" cy="'+(58+dy)+'" r="10" fill="#26323a"/><circle cx="'+(c-3)+'" cy="'+(55+dy)+'" r="3" fill="#fff"/>'}
 if(m>0)r+='<polygon points="50,36 96,36 96,'+(44+lid*.3)+' 50,'+(50+lid*.9)+'" fill="'+bc+'"/><polygon points="104,36 150,36 150,'+(50+lid*.9)+' 104,'+(44+lid*.3)+'" fill="'+bc+'"/>';
 if(m>=2)r+='<path d="M64 84q-5 9 0 12 5-3 0-12z" fill="#6bb6e8"/>';
 const h=w.hat,e=w.eyes,n=w.neck;
 if(h==='cap')r+='<path d="M58 38a42 26 0 0 1 84 0z" fill="#d94f4f"/><rect x="58" y="36" width="96" height="5" rx="2" fill="#a83a3a"/>';
 if(h==='tophat')r+='<rect x="76" y="6" width="48" height="30" fill="#26323a"/><rect x="62" y="34" width="76" height="6" rx="3" fill="#26323a"/><rect x="76" y="26" width="48" height="5" fill="#d94f4f"/>';
 if(h==='crown')r+='<path d="M68 38l4-24 14 12 14-16 14 16 14-12 4 24z" fill="#f2c94c" stroke="#b98a1c" stroke-width="2"/>';

 if(FX)r+=FXD[FX]||'<text x="30" y="30" font-size="20">✨</text><text x="140" y="24" font-size="20">✨</text>';

/* spelen: quest afvinken */
function toggle(id){
 const k=ymd(today()),T=S.tasks.find(t=>t.id===id);if(!T)return;S.done[k]=S.done[k]||{};
 if(S.done[k][id]!==undefined){delete S.done[k][id];SND.undo()}
 else{
  if(!okDay(T)){toast(T.n+': alleen '+(T.days.includes(1)?'van maandag tot vrijdag':'in het weekend'));SND.err();return}
  if(T.cap&&wCount(id)>=T.cap){toast(T.n+': weekdoel van '+T.cap+'x is al gehaald');SND.err();return}
  const mult=xmult();S.done[k][id]=Math.round(T.xp*mult);SND.ok();
  toast('+'+S.done[k][id]+' XP'+(mult>1?' (bonus x'+mult.toFixed(2)+')':''));
  FX=FXD[id]?id:'x';clearTimeout(ft);ft=setTimeout(()=>{FX=null;renderStage()},3500);
  setTimeout(()=>{say(T.say||'Mooi gedaan! ✨',3500);anim('jump')},60);
 }
 const wk=wDays()[0],wb=wDays().reduce((a,d)=>a+dayXP(d),0);
 if(wb>=WGOAL&&!S.bonus[wk]){S.bonus[wk]=BONUS;SND.lvl();toast('Weekdoel gehaald! +'+BONUS+' XP bonus 🎉')}
 else if(wb<WGOAL&&S.bonus[wk])delete S.bonus[wk];
 const l=lvlOf(total());
 while(l>S.maxLvl){S.maxLvl++;S.coins+=15;let t='Level '+S.maxLvl+'! +15 🪙';if(S.maxLvl%5===0){S.coins+=60;t='Evolutie! Bolt is gegroeid. +75 🪙'}
  setTimeout(()=>{SND.lvl();toast(t);hearts();anim('spin')},400)}
 save();render()}

/* views */
function vToday(){const k=ymd(today()),mult=xmult();
 return '<h2>Quests van vandaag</h2>'+(wkEnd()?'<div class="card">🎉 Weekendbonus: al je XP telt vandaag x1,5.</div>':'')+S.tasks.map(T=>{const on=S.done[k]&&S.done[k][T.id]!==undefined,off=!on&&!okDay(T);
  return '<button class="q'+(on?' on':'')+(off?' off':'')+'" data-act="q" data-id="'+T.id+'"><span class="ic">'+esc(T.ic)+'</span><span class="t"><span>'+esc(T.n)+'</span><small>'+(off?(T.days.includes(1)?'alleen ma–vr':'alleen za–zo'):T.cap?wCount(T.id)+' / '+T.cap+' deze week':T.days?(T.days.includes(1)?'elke werkdag':'elk weekend'):'elke dag')+'</small></span><span class="x">'+(off?'–':'+'+(on?S.done[k][T.id]:Math.round(T.xp*mult))+' XP')+'</span></button>'}).join('')+
 '<details class="add"><summary>＋ Eigen quest toevoegen</summary><input id="nq" maxlength="30" placeholder="Naam, bijvoorbeeld water drinken"><div class="row"><div><label>XP</label><input id="nx" type="number" min="5" max="50" value="10"></div><div><label>Hoe vaak</label><select id="nf"><option value="0">elke dag</option>'+[1,2,3,4,5,6,7].map(i=>'<option value="'+i+'">'+i+'x per week</option>').join('')+'</select></div><div><label>Icoon</label><input id="ni" maxlength="2" placeholder="⭐"></div></div><label class="note">Op welke dagen?</label><select id="nd"><option value="0">Alle dagen</option><option value="1">Enkel ma–vr</option><option value="2">Enkel za–zo</option></select><div style="height:10px"></div><button class="btn" data-act="addq">Toevoegen</button>'+
 S.tasks.filter(t=>t.custom).map(t=>'<div class="cq"><span>'+esc(t.ic)+' '+esc(t.n)+'</span><button data-act="delq" data-id="'+t.id+'" aria-label="Verwijderen">✕</button></div>').join('')+'</details>'}
function nav(p,n,label,dis){return '<div class="nav"><button data-act="'+p+'" aria-label="Vorige">‹</button><b>'+label+'</b><button data-act="'+n+'" '+(dis?'disabled':'')+' aria-label="Volgende">›</button></div>'}
function vWeek(){const d=wDays(wOff),xs=d.map(dayXP),mx=Math.max(GOAL*1.5,...xs),f=x=>{const a=new Date(x);return a.getDate()+'/'+(a.getMonth()+1)};
 const tot=xs.reduce((a,b)=>a+b,0)+(S.bonus[d[0]]||0),hit=xs.filter(x=>x>=GOAL).length;
 return nav('wprev','wnext',f(d[0])+' – '+f(d[6]),wOff>=0)+'<div class="chart">'+d.map((k,i)=>'<div class="col"><b>'+xs[i]+'</b><div class="bw"><i class="'+(xs[i]>=GOAL?'hit':'')+'" style="height:'+(xs[i]/mx*100)+'%"></i></div>'+DN[i]+'</div>').join('')+'</div>'+
 '<p class="note">Groene balk = dagdoel van '+GOAL+' XP gehaald.</p><div class="card"><b>'+tot+' XP</b> deze week, '+hit+' van 7 dagen dagdoel gehaald'+(S.bonus[d[0]]?' · weekbonus binnen 🏆':'')+'</div>'+
 S.tasks.map(T=>{const c=wCount(T.id,wOff),g=T.cap||(T.days?T.days.length:7);return '<div class="card"><div class="lbl" style="margin:0 0 6px"><span>'+esc(T.ic)+' '+esc(T.n)+'</span><span>'+c+' / '+g+(c>=g?' ✅':'')+'</span></div><div class="bar g"><i style="width:'+Math.min(100,c/g*100)+'%"></i></div></div>'}).join('')}
function vMonth(){const n=today(),b=new Date(n.getFullYear(),n.getMonth()+mOff,1),y=b.getFullYear(),mo=b.getMonth(),dim=new Date(y,mo+1,0).getDate(),off=(b.getDay()+6)%7,tk=ymd(n);
 let cells=DN.map(x=>'<div class="e">'+x+'</div>').join('')+'<div class="e"></div>'.repeat(off),tot=0,hit=0,run=0,best=0,keys=[];
 for(let i=1;i<=dim;i++){const k=ymd(new Date(y,mo,i)),x=dayXP(k),fut=k>tk,past=k<tk&&k>=S.start;keys.push(k);tot+=x;
  if(x>=GOAL){hit++;run++;best=Math.max(best,run)}else run=0;
  cells+='<div class="'+(x>=GOAL?'hit':fut?'fut':past?'miss':'')+(k===tk?' today':'')+'"><b>'+i+'</b>'+(x||'')+'</div>'}
 const bon=Object.keys(S.bonus).filter(k=>k.slice(0,7)===ymd(b).slice(0,7)).length;
 return nav('mprev','mnext',MN[mo]+' '+y,mOff>=0)+'<div class="cal">'+cells+'</div><div class="stats"><div class="stat"><b>'+tot+'</b><span>XP</span></div><div class="stat"><b>'+hit+'</b><span>dagdoelen</span></div><div class="stat"><b>'+best+'</b><span>beste reeks</span></div></div>'+(bon?'<p class="note">'+bon+'x weekbonus verdiend deze maand 🏆</p>':'')+
 '<h2>Quests deze maand</h2>'+S.tasks.map(T=>'<div class="card"><div class="lbl" style="margin:0"><span>'+esc(T.ic)+' '+esc(T.n)+'</span><b>'+keys.filter(k=>S.done[k]&&S.done[k][T.id]!==undefined).length+'x</b></div></div>').join('')}
function vShop(){const nx=(Math.floor(S.maxLvl/5)+1)*5,item=i=>{const o=S.owned.includes(i.id),on=S.wear[i.k]===i.id;
  return '<button class="it'+(on?' on':'')+'" data-act="'+(o?'eq':'buy')+'" data-id="'+i.id+'"><b>'+i.ic+'</b>'+i.n+'<small>'+(i.k==='room'&&o?'in kamer ✓':o?(on?'aan ✓':'uit'):i.p+' 🪙')+'</small></button>'},
 sec=(t,k)=>'<h2>'+t+'</h2><div class="grid">'+SHOP.filter(i=>k.includes(i.k)).map(item).join('')+'</div>';
 return '<div class="card">Je hebt <b>'+S.coins+' 🪙</b>. Elk level geeft 15 munten. Elke 5 levels evolueert Bolt en krijg je er 60 extra bij. Volgende evolutie: level '+nx+'.</div>'+sec('Hoedjes en brillen',['hat','eyes'])+sec('Sjaaltjes en kleur',['neck','color'])+sec('Zijn kamer',['room'])+'<p class="note">Tik op een gekocht kledingstuk om het aan of uit te doen.</p>'}

/* render */
function renderStage(){const t=total(),lv=S.maxLvl,lo=40*(lv-1)**2,hi=40*lv*lv;
 document.getElementById('robot').innerHTML=robot(mood());
 document.getElementById('say').textContent=bub||base;
 document.getElementById('lv').textContent=lv;
 document.getElementById('evo').textContent=lv>=5?'· evolutie '+Math.floor(lv/5):'';
 document.getElementById('coins').textContent='🪙 '+S.coins;
 document.getElementById('xpn').textContent=Math.max(0,t-lo)+' / '+(hi-lo)+' XP';
 document.getElementById('lvbar').style.width=Math.max(0,Math.min(100,(t-lo)/(hi-lo)*100))+'%';
 document.getElementById('snd').textContent=S.mute?'🔇':'🔊'}
function render(){const k=ymd(today()),w=wXP(),st=streak();renderStage();
 document.getElementById('sStreak').textContent=(st>0?'🔥 ':'')+st;
 document.getElementById('sDay').textContent=dayXP(k);document.getElementById('sWeek').textContent=w;
 document.getElementById('dgl').textContent=Math.min(dayXP(k),GOAL)+' / '+GOAL+' XP';
 document.getElementById('dbar').style.width=Math.min(100,dayXP(k)/GOAL*100)+'%';
 document.getElementById('wgl').textContent=Math.min(w,WGOAL)+' / '+WGOAL+' XP';
 document.getElementById('wbar').style.width=Math.min(100,w/WGOAL*100)+'%';
 document.getElementById('tabs').innerHTML=[['today','Vandaag'],['week','Week'],['month','Maand'],['shop','Winkel']].map(x=>'<button data-act="tab" data-id="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('');
 document.getElementById('view').innerHTML={today:vToday,week:vWeek,month:vMonth,shop:vShop}[tab]()}

document.addEventListener('click',e=>{
 if(e.target.closest('#robot')){pet();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='tab'){tab=id;render()}
 else if(a==='q')toggle(id);
 else if(a==='pet')pet();else if(a==='play')play();
 else if(a==='snd'){S.mute=!S.mute;save();renderStage();if(!S.mute)SND.ok()}
 else if(a==='wprev'){wOff--;render()}else if(a==='wnext'){wOff++;render()}
 else if(a==='mprev'){mOff--;render()}else if(a==='mnext'){mOff++;render()}
 else if(a==='addq'){const n=document.getElementById('nq').value.trim();if(!n){toast('Geef je quest een naam');return}
  const xp=Math.max(5,Math.min(50,parseInt(document.getElementById('nx').value)||10)),f=parseInt(document.getElementById('nf').value)||0,ic=document.getElementById('ni').value.trim()||'⭐';
  S.tasks.push({id:'c'+Date.now(),n,xp,cap:f||undefined,days:[null,[1,2,3,4,5],[0,6]][parseInt(document.getElementById('nd').value)||0]||undefined,ic,custom:true,say:'Mooi gedaan, '+n.toLowerCase()+'! ✨'});save();SND.buy();toast('Quest toegevoegd');render()}
 else if(a==='delq'){if(confirm('Deze quest verwijderen? Eerder verdiende XP blijft staan.')){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}}
 else if(a==='buy'){const i=SHOP.find(x=>x.id===id);if(S.coins<i.p){toast('Nog '+(i.p-S.coins)+' 🪙 te kort');SND.err();return}
  S.coins-=i.p;S.owned.push(id);if(i.k!=='room')S.wear[i.k]=id;save();SND.buy();render();say('Wauw, '+i.n.toLowerCase()+'! Dankjewel! '+i.ic,3000);anim('spin')}
 else if(a==='eq'){const i=SHOP.find(x=>x.id===id);if(i.k==='room')return;S.wear[i.k]=S.wear[i.k]===id?undefined:id;save();SND.tap();render()}
 else if(a==='reset'){if(confirm('Alle punten, kleertjes en Bolt’s level wissen?')){try{localStorage.removeItem(KEY)}catch(x){}load();base0();render()}}
});
load();base0();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
