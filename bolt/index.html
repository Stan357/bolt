<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolt</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cfdadf">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#cfdadf;--card:#f4f8f9;--ink:#26323a;--mute:#5d6e78;--acc:#d4a024;--acc2:#2f7d6d;--line:#b3c3ca;--track:#3b3a36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2328;--card:#26323a;--ink:#e8eef1;--mute:#9db0ba;--line:#3b4b55;--acc:#e3b23c;--acc2:#4fb39f}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-size:16px}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px}
.stage{background:var(--card);border-radius:24px;padding:8px 12px 16px;text-align:center}
.stage svg{width:210px;height:210px;max-width:70%}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.say{font-size:15px;color:var(--mute);margin:2px 0 10px;min-height:22px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .4s}
.bar.g i{background:var(--acc2)}
.lbl{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
h2{font-size:17px;margin:18px 0 8px;font-weight:600}
.q{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.q:focus-visible{outline:3px solid var(--acc2)}
.q.on{border-color:var(--acc2)}
.q .ic{font-size:24px}
.q .t{flex:1}
.q .t small{display:block;color:var(--mute);font-size:13px}
.q .x{font-weight:600;color:var(--acc2);white-space:nowrap}
.q.on .t span{text-decoration:line-through;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{background:var(--card);border-radius:12px;text-align:center;padding:6px 0;font-size:12px;color:var(--mute)}
.d b{display:block;font-size:15px;color:var(--ink)}
.d.hit{background:var(--acc2)}.d.hit,.d.hit b{color:#fff}
.d.today{outline:2px solid var(--acc)}
.d.miss b{color:#c0533a}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
.toast.s{opacity:1}
.reset{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;margin-top:20px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Bolt</h1><span class="pill" id="lvlpill"></span></div>
  <div class="stage">
    <div id="robot"></div>
    <div class="say" id="say"></div>
    <div class="lbl"><span>Level <b id="lv"></b></span><span id="xpn"></span></div>
    <div class="bar"><i id="lvbar"></i></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sStreak">0</b><span>dagen streak</span></div>
    <div class="stat"><b id="sDay">0</b><span>XP vandaag</span></div>
    <div class="stat"><b id="sWeek">0</b><span>XP deze week</span></div>
  </div>
  <div class="lbl"><span>Dagdoel</span><span id="dgl"></span></div>
  <div class="bar g"><i id="dbar"></i></div>
  <div class="lbl"><span>Weekdoel (bonus +50 XP)</span><span id="wgl"></span></div>
  <div class="bar g"><i id="wbar"></i></div>

  <h2>Quests van vandaag</h2>
  <div id="quests"></div>

  <h2>Deze week</h2>
  <div class="week" id="week"></div>
  <button class="reset" id="reset">Alles opnieuw beginnen</button>
</main>
<div class="toast" id="toast"></div>

<script>
const TASKS=[
 {id:'study',n:'Studeren (2 uur)',xp:20,ic:'📚'},
 {id:'class',n:'Naar de les',xp:15,cap:5,ic:'🎓'},
 {id:'gym',n:'Gym',xp:20,cap:5,ic:'🏋️'},
 {id:'run',n:'Gaan lopen',xp:25,cap:2,ic:'🏃'},
 {id:'bike',n:'Gaan fietsen',xp:30,cap:1,ic:'🚴'}
];
const GOAL=30, WGOAL=300, BONUS=50, KEY='bolt-v1';
const DN=['ma','di','wo','do','vr','za','zo'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addD(d,-((d.getDay()+6)%7));
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||!S.done)S={start:ymd(new Date()),done:{},bonus:{},maxLvl:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dayXP=k=>Object.values(S.done[k]||{}).reduce((a,b)=>a+b,0);
const today=()=>new Date();
function streak(){let d=today();if(dayXP(ymd(d))<GOAL)d=addD(d,-1);let n=0;
 while(ymd(d)>=S.start&&dayXP(ymd(d))>=GOAL){n++;d=addD(d,-1)}return n}
function misses(){let n=0;for(let i=1;i<=7;i++){const k=ymd(addD(today(),-i));if(k>=S.start&&dayXP(k)<GOAL)n++}return n}
function weekDays(){const m=monday(today());return [...Array(7)].map((_,i)=>ymd(addD(m,i)))}
const wCount=id=>weekDays().filter(k=>S.done[k]&&S.done[k][id]!==undefined).length;
const wXP=()=>weekDays().reduce((a,k)=>a+dayXP(k),0)+(S.bonus[weekDays()[0]]||0);
function total(){return Object.keys(S.done).reduce((a,k)=>a+dayXP(k),0)+Object.values(S.bonus).reduce((a,b)=>a+b,0)}
const lvlOf=t=>Math.floor(Math.sqrt(t/40))+1;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),2200)}

function toggle(id){
 const k=ymd(today()),T=TASKS.find(t=>t.id===id);S.done[k]=S.done[k]||{};
 if(S.done[k][id]!==undefined){delete S.done[k][id]}
 else{
  if(T.cap&&wCount(id)>=T.cap){toast(T.n+': weekdoel van '+T.cap+'x is al gehaald'); return}
  const mult=1+Math.min(streak(),10)*0.05;
  S.done[k][id]=Math.round(T.xp*mult);
  toast('+'+S.done[k][id]+' XP'+(mult>1?' (streak x'+mult.toFixed(2)+')':''));
 }
 const wk=weekDays()[0];
 const wBase=weekDays().reduce((a,d)=>a+dayXP(d),0);
 if(wBase>=WGOAL&&!S.bonus[wk]){S.bonus[wk]=BONUS;toast('Weekdoel gehaald! +'+BONUS+' XP bonus 🎉')}
 else if(wBase<WGOAL&&S.bonus[wk]){delete S.bonus[wk]}
 const l=lvlOf(total());if(l>S.maxLvl){S.maxLvl=l;toast('Level up! Bolt is nu level '+l+' ⭐')}
 save();render();
}

function mood(){const m=misses();return m===0?0:m<=2?1:m<=4?2:3}
const SAY=[
 ['Bolt is stralend blij! Zo houden. ✨','Bolt rijdt blij rondjes.'],
 ['Bolt is oké, maar mist je een beetje.'],
 ['Bolt is verdrietig. Een quest doen helpt!'],
 ['Bolt is heel verdrietig… kom terug naar hem toe. 💧']
];
function robot(m,lv){
 const lid=[0,8,16,24][m], dy=[0,0,3,6][m];
 const tear=m>=2?'<path d="M64 84 q-5 9 0 12 q5 -3 0 -12z" fill="#6bb6e8"/>':'';
 const eyeL='<rect x="52" y="38" width="42" height="38" rx="19" fill="#e6ecef" stroke="#3b3a36" stroke-width="3"/><circle cx="73" cy="'+(58+dy)+'" r="10" fill="#26323a"/><circle cx="70" cy="'+(55+dy)+'" r="3" fill="#fff"/>';
 const eyeR='<rect x="106" y="38" width="42" height="38" rx="19" fill="#e6ecef" stroke="#3b3a36" stroke-width="3"/><circle cx="127" cy="'+(58+dy)+'" r="10" fill="#26323a"/><circle cx="124" cy="'+(55+dy)+'" r="3" fill="#fff"/>';
 const lids=m===0?'':'<polygon points="50,36 96,36 96,'+(44+lid*0.3)+' 50,'+(44+lid*0.9+6)+'" fill="#b98a1c"/><polygon points="104,36 150,36 150,'+(44+lid*0.9+6)+' 104,'+(44+lid*0.3)+'" fill="#b98a1c"/>';
 const heart=['#e0533d','#e0a03d','#7f8c93','#4b5a62'][m];
 const plant=lv>=2?'<path d="M128 112 v-14" stroke="#4f9a4a" stroke-width="3"/><path d="M128 98 q-12 -4 -12 -14 q12 0 12 14z M128 98 q12 -4 12 -14 q-12 0 -12 14z" fill="#5db35a"/>':'';
 const star=lv>=5?'<path d="M100 8 l4 9 10 1 -8 7 3 10 -9 -6 -9 6 3 -10 -8 -7 10 -1z" fill="#f2c94c"/>':'';
 return '<svg viewBox="0 0 200 200" role="img" aria-label="Bolt het robotje"><g class="'+(m===0?'bob':'')+'">'+
 star+
 '<rect x="96" y="76" width="8" height="22" fill="#6b6a64"/>'+
 '<rect x="46" y="96" width="108" height="64" rx="10" fill="#d4a024" stroke="#3b3a36" stroke-width="3"/>'+
 '<rect x="46" y="128" width="108" height="6" fill="#b98a1c"/>'+
 '<rect x="84" y="106" width="32" height="18" rx="4" fill="#26323a"/>'+
 '<path d="M100 120 l-8 -7 a4.5 4.5 0 0 1 8 -4 a4.5 4.5 0 0 1 8 4z" fill="'+heart+'"/>'+
 plant+
 '<path d="M46 112 q-22 6 -20 26" stroke="#6b6a64" stroke-width="7" fill="none" stroke-linecap="round"/>'+
 '<path d="M154 112 q22 6 20 26" stroke="#6b6a64" stroke-width="7" fill="none" stroke-linecap="round"/>'+
 '<rect x="38" y="152" width="124" height="34" rx="17" fill="#3b3a36"/>'+
 '<circle cx="62" cy="169" r="8" fill="#6b6a64"/><circle cx="100" cy="169" r="8" fill="#6b6a64"/><circle cx="138" cy="169" r="8" fill="#6b6a64"/>'+
 eyeL+eyeR+lids+tear+'</g></svg>';
}

function render(){
 const t=total(),l=lvlOf(t),m=mood(),k=ymd(today()),st=streak();
 const lo=40*(l-1)*(l-1),hi=40*l*l;
 document.getElementById('robot').innerHTML=robot(m,l);
 document.getElementById('say').textContent=SAY[m][0];
 document.getElementById('lv').textContent=l;
 document.getElementById('lvlpill').textContent='⭐ '+t+' XP totaal';
 document.getElementById('xpn').textContent=(t-lo)+' / '+(hi-lo)+' XP';
 document.getElementById('lvbar').style.width=Math.min(100,(t-lo)/(hi-lo)*100)+'%';
 document.getElementById('sStreak').textContent=(st>0?'🔥 ':'')+st;
 document.getElementById('sDay').textContent=dayXP(k);
 const w=wXP();document.getElementById('sWeek').textContent=w;
 document.getElementById('dgl').textContent=Math.min(dayXP(k),GOAL)+' / '+GOAL+' XP';
 document.getElementById('dbar').style.width=Math.min(100,dayXP(k)/GOAL*100)+'%';
 document.getElementById('wgl').textContent=Math.min(w,WGOAL)+' / '+WGOAL+' XP';
 document.getElementById('wbar').style.width=Math.min(100,w/WGOAL*100)+'%';
 const mult=1+Math.min(st,10)*0.05;
 document.getElementById('quests').innerHTML=TASKS.map(T=>{
  const on=S.done[k]&&S.done[k][T.id]!==undefined;
  const sub=T.cap?wCount(T.id)+' / '+T.cap+' deze week':'elke dag';
  return '<button class="q'+(on?' on':'')+'" data-id="'+T.id+'"><span class="ic">'+T.ic+'</span><span class="t"><span>'+T.n+'</span><small>'+sub+'</small></span><span class="x">'+(on?'+'+S.done[k][T.id]:'+'+Math.round(T.xp*mult))+' XP</span></button>'}).join('');
 document.getElementById('week').innerHTML=weekDays().map((d,i)=>{
  const x=dayXP(d),past=d<k&&d>=S.start;
  return '<div class="d'+(x>=GOAL?' hit':past?' miss':'')+(d===k?' today':'')+'">'+DN[i]+'<b>'+x+'</b></div>'}).join('');
}
document.getElementById('quests').addEventListener('click',e=>{const b=e.target.closest('.q');if(b)toggle(b.dataset.id)});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Alle punten en Bolt’s level wissen?')){try{localStorage.removeItem(KEY)}catch(e){}load();render()}});
load();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
